theme = "catppuccin-latte"
appearance = "system"
theme_dark = "catppuccin-mocha"
theme_light = "catppuccin-latte"

diff_view = "side-by-side"
ignore_whitespace = false
commit_order = "descending"
initial_commit_selection = "all"
show_file_list = true
compact_folders = false
show_pr_checks = false
show_pr_comments = true
show_commits = true
show_reviewed = true
mouse = true
leader = ","
editor = "nvim"
comment_vim = false
q_quits = false
comment_tab_width = 2
wrap = false
relative_line_numbers = false
cursor_line = true
search_highlight = true
transparent_background = true
scroll_offset = 5
no_update_check = false
review_watch_interval_ms = 1000
single_file_view = false
username = "user"
diff_watch_interval_ms = 0

backend = "libgit2"

comment_types = [
  { id = "note", label = "提问", definition = "请求澄清", color = "yellow" },
  { id = "suggestion", definition = "可改进之处" },
  { id = "issue", definition = "需要修复的问题" },
  { id = "praise", definition = "正面反馈" },
  { id = "nit", label = "小建议", definition = "可选的小调整", color = "#d19a66" },
]

[forge]
comment_type_prefix = true

[export]
intro = "我审阅了你的代码，以下是评论意见，请处理。"
scope_line = true
pr_metadata = true
comments_header = "## 本地 tuicr 评论"
remote_comments_header = "## 已有 GitHub 评论"
legend = true
session_header = true
